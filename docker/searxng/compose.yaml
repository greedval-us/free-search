name: free-search-searxng

services:
    searxng:
        image: ghcr.io/searxng/searxng:${SEARXNG_VERSION:-latest}
        restart: unless-stopped
        ports:
            - '127.0.0.1:8088:8080'
        environment:
            SEARXNG_SECRET: ${SEARXNG_SECRET:?Run Start.ps1 to generate the local secret}
            SEARXNG_BASE_URL: http://127.0.0.1:8088/
            GRANIAN_HOST: '0.0.0.0'
            GRANIAN_PORT: '8080'
            FORCE_OWNERSHIP: 'false'
        volumes:
            - type: bind
              source: ./settings.yml
              target: /etc/searxng/settings.yml
              read_only: true
              bind:
                  create_host_path: false
            - type: volume
              source: cache
              target: /var/cache/searxng
        healthcheck:
            test:
                - CMD
                - /usr/local/searxng/.venv/bin/python
                - -c
                - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/', timeout=5).close()"
            interval: 30s
            timeout: 10s
            start_period: 30s
            retries: 3
        logging:
            driver: json-file
            options:
                max-size: '5m'
                max-file: '2'

volumes:
    cache:
