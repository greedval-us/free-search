name: Repository hygiene

on:
  push:
    branches: [main, develop, master, workos, 'codex/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hygiene-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repository-hygiene:
    name: repository-hygiene
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Reject tracked files covered by gitignore
        shell: bash
        run: |
          tracked_ignored="$(git ls-files --cached --ignored --exclude-standard)"
          if [ -n "$tracked_ignored" ]; then
            echo '::error::Local or generated files are tracked despite .gitignore. Remove them with git rm --cached.'
            printf '%s\n' "$tracked_ignored"
            exit 1
          fi

      - name: Require reproducible dependency locks and environment example
        run: git ls-files --error-unmatch composer.lock package-lock.json .env.example
