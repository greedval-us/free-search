name: CI

on:
  push:
    branches: [main, develop, master, workos, 'codex/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: quality
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
          extensions: mbstring, xml, curl, zip, gd, intl, pdo_mysql
          tools: composer:v2

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Install Node dependencies
        run: npm ci

      - name: Prepare environment and generate typed routes
        run: |
          cp .env.example .env
          php artisan key:generate
          php artisan wayfinder:generate --with-form

      - name: Validate Composer manifest and lock file
        run: composer validate --strict

      - name: Run frontend quality checks
        run: npm run quality:check

      - name: Run frontend unit tests
        run: npm run test:unit

      - name: Check PHP style
        run: composer run lint:check

  tests:
    name: tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: free_search_test
          MYSQL_USER: free_search_test
          MYSQL_PASSWORD: synthetic-suite-only
          MYSQL_ROOT_PASSWORD: synthetic-root-test-only
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    env:
      TEST_DB_PASSWORD: synthetic-suite-only
      QUOTA_CONCURRENCY_DB_HOST: 127.0.0.1
      QUOTA_CONCURRENCY_DB_PORT: 3306
      QUOTA_CONCURRENCY_DB_DATABASE: free_search_quota_concurrency_test
      QUOTA_CONCURRENCY_DB_USERNAME: quota_concurrency_test
      QUOTA_CONCURRENCY_DB_PASSWORD: synthetic-concurrency-only

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
          extensions: mbstring, xml, curl, zip, gd, intl, pdo_mysql
          tools: composer:v2

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Install Node dependencies
        run: npm ci

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Build assets
        run: npm run build

      - name: Prepare dedicated database for concurrency tests
        run: |
          docker exec -i "${{ job.services.mysql.id }}" sh -c 'MYSQL_PWD="$MYSQL_ROOT_PASSWORD" exec mysql -uroot' <<'SQL'
          CREATE DATABASE free_search_quota_concurrency_test;
          CREATE USER 'quota_concurrency_test'@'%' IDENTIFIED BY 'synthetic-concurrency-only';
          GRANT ALL ON `free\_search\_quota\_concurrency\_test`.* TO 'quota_concurrency_test'@'%';
          SQL

      - name: Run test suite on MySQL
        run: php artisan test --exclude-group=migration-upgrade

  build:
    name: build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
          extensions: mbstring, xml, curl, zip, gd, intl, pdo_mysql
          tools: composer:v2

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Install Node dependencies
        run: npm ci

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Build assets
        run: npm run build

  migration-upgrade:
    name: migration-upgrade
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: free_search_refactor_upgrade_test
          MYSQL_USER: migration_upgrade_test
          MYSQL_PASSWORD: synthetic-upgrade-test-only
          MYSQL_ROOT_PASSWORD: synthetic-root-test-only
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    env:
      MIGRATION_UPGRADE_DB_DATABASE: free_search_refactor_upgrade_test
      MIGRATION_UPGRADE_DB_HOST: 127.0.0.1
      MIGRATION_UPGRADE_DB_PORT: 3306
      MIGRATION_UPGRADE_DB_USERNAME: migration_upgrade_test
      MIGRATION_UPGRADE_DB_PASSWORD: synthetic-upgrade-test-only

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
          extensions: mbstring, xml, curl, zip, gd, intl, pdo_mysql
          tools: composer:v2

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Upgrade baseline schema and queued data on MySQL
        run: php vendor/bin/phpunit --filter=MigrationUpgradeTest
